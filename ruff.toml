# Set the target Python version
target-version = "py311"

# Enable specific linting rules
select = ["E", "F", "W", "I" , "UP"]

# Maximum line length
line-length = 100

# Fix issues automatically where possible
fix = true

include = ["*.py", "*.ipynb"]
exclude = ["notebooks"]

ignore = [
    "E501",  # Line too long
    "F722",  # Do not use bare except
    "E402",  # Module level import not at top of file
    "E731",
]
